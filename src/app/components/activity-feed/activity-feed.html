@if (activities().length > 0) {
  <div class="bg-[#12121a] rounded-2xl border border-white/5 p-6">
    <h3 class="text-base font-semibold text-white mb-4 flex items-center gap-2">
      <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      Atividades Recentes
    </h3>

    <div class="space-y-1 max-h-80 overflow-y-auto pr-1 custom-scrollbar">
      @for (activity of activities(); track activity.id) {
        <div class="flex items-start gap-3 py-2.5 px-3 rounded-xl hover:bg-white/5 transition-colors">
          <span class="text-lg mt-0.5 shrink-0">{{ getActionMeta(activity.action).icon }}</span>
          <div class="flex-1 min-w-0">
            <p class="text-sm text-slate-300 truncate">
              <span class="font-medium text-white">{{ activity.personName }}</span>
              <span class="text-slate-500 mx-1">·</span>
              {{ activity.details }}
            </p>
          </div>
          <span class="text-xs text-slate-600 shrink-0 mt-0.5">{{ formatDate(activity.createdAt) }}</span>
        </div>
      }
    </div>
  </div>
}
